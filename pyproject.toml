[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pso-segmentation"
version = "0.1.0"
description = "Robust package for segmentation optimization using Particle Swarm Optimization (PSO)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Léo Colin", email = "leocolin7002@gmail.com"},
]
keywords = ["PSO", "particle swarm optimization", "segmentation", "optimization", "data science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
]

[project.optional-dependencies]
viz = ["plotly>=6.0"]
docs = ["sphinx>=5.0", "sphinx-rtd-theme", "myst-parser"]
dev = ["pytest>=7.0", "ruff", "mypy", "pytest-cov"]
all = ["pso-segmentation[viz,docs,dev]"]

[tool.hatch.version]
path = "src/pso_segmentation/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pso_segmentation"]

# ==================== RUFF ====================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["pso_segmentation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ==================== MYPY ====================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
implicit_reexport = false

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "sphinx.*",
]
ignore_missing_imports = true

# ==================== PYTEST ====================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src/pso_segmentation",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
